# 구글 시트 → data/benefits.json 동기화
# 저장소 Actions 탭에서 "Run workflow" 버튼으로 실행한다. 점검을 통과해야만 커밋된다.
name: 시트 → 혜택 데이터 동기화

on:
  workflow_dispatch:
  # 매일 자동 실행하려면 아래 두 줄의 주석을 푼다 (매일 09:00 KST)
  # schedule:
  #   - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 시트 내려받아 변환
        run: node scripts/sync-sheet.mjs
      - name: 게시 전 점검
        run: |
          node scripts/check-data.mjs
          node scripts/test-logic.mjs
      - name: 바뀐 데이터 커밋
        run: |
          if git diff --quiet -- data; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "시트에서 혜택 데이터 동기화"
          git push
